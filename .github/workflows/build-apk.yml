name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm install

      - name: Install Capacitor CLI & Android Platform
        run: |
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest

      - name: Build Next.js App
        run: npm run build

      - name: Configure Capacitor
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.chatai.app",
            "appName": "CHAT AI",
            "webDir": "public",
            "server": {
              "url": "https://ai-chat-git-main-tanzil26.vercel.app",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CHAT-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-AI-Android-APK
          path: output/CHAT-AI.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "CHAT AI Mobile Android APK"
          body: |
            ### 📱 CHAT AI Mobile Android Application
            Download the official `CHAT-AI.apk` below and install it directly on your Android phone!
            
            - **Online Mode**: Ultra-fast responses powered by Google Gemini.
            - **Offline Mode**: Private on-device inference with mobile-optimized models (Qwen 2.5 0.5B, Llama 3.2 1B).
            - **Model Gatekeeper**: In-app download screen to install and verify offline models before chatting.
          files: output/CHAT-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
